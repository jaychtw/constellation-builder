<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080e1a"><title>Constellation Builder</title><style>
*{box-sizing:border-box}body{margin:0;background:#080e1a;color:#eae4cf;font:16px Georgia,serif;min-height:100svh;background-image:radial-gradient(ellipse at 60% 42%,#24344780,transparent 63%),linear-gradient(140deg,#0c1523,#121929 55%,#080e18)}canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}main{position:relative;min-height:100svh;padding:clamp(16px,4vw,58px);display:grid;grid-template-rows:auto 1fr auto;gap:14px}header,footer,.bar{display:flex;justify-content:space-between;align-items:center;gap:14px}header{border-bottom:1px solid #a38c5644;padding-bottom:16px}h1{font-weight:normal;font-size:clamp(19px,2.8vw,38px);margin:0}small,.meta,button,select{font:11px system-ui;letter-spacing:.13em;text-transform:uppercase}.gold,.meta{color:#d6b878}.scene{display:grid;grid-template-columns:1fr minmax(300px,1.4fr) .22fr;align-items:center}.notes{padding-left:3vw}h2{font-size:clamp(43px,6vw,96px);font-weight:normal;letter-spacing:-.055em;margin:10px 0}em{font-size:clamp(20px,2.5vw,36px);color:#c1b598}p{color:#c6c8c9;line-height:1.6;max-width:26ch}.field{width:min(100%,65svh);aspect-ratio:1;position:relative;margin:auto;border:1px solid #bfa26a58;border-radius:50%;background:radial-gradient(circle,#47537519,transparent 70%);box-shadow:0 0 0 7px #101925,0 0 0 8px #bfa26a33}.field:before{content:attr(data-north);position:absolute;top:-1.5em;left:49%;color:#bcaa82;font:10px Georgia}.field svg,.art{position:absolute;inset:0;width:100%;height:100%;border-radius:50%}.art{inset:8%;width:84%;height:84%;background-image:url(engravings.webp);background-size:500% 200%;mix-blend-mode:screen;opacity:0;transition:opacity 1.3s}.field.done .art{opacity:.9}.field.done svg{opacity:.4}.star{cursor:pointer}.star:focus{outline:none}.star:focus .core,.star:hover .core{stroke:#fff;stroke-width:.7}footer{border-top:1px solid #a38c5644;padding-top:16px}button,select{color:#e4d9bd;border:1px solid #95845f78;background:#111b28;border-radius:3px;padding:10px;cursor:pointer}#progress{font-size:14px;color:#d5c49b}button:focus-visible,select:focus-visible{outline:2px solid #eccb88}.bar{justify-content:flex-start;flex-wrap:wrap}.sr{position:absolute;clip-path:inset(50%);width:1px;height:1px;overflow:hidden}

</style><canvas aria-hidden="true"></canvas><main><header><h1><span class="gold">✧</span> <span id="title">Constellation Builder</span></h1><div class="bar"><small id="total"></small><button id="language">繁體中文</button></div></header><div class="scene"><section class="notes"><small class="meta" id="plate"></small><h2 id="nameplate"></h2><em id="subtitle"></em><p id="hint"></p><div id="progress" aria-live="polite"></div></section><div class="field"><div class="art"></div><svg viewBox="0 0 100 100" aria-label="Selectable stars"></svg></div></div><footer><div class="bar"><button id="prev" aria-label="Previous constellation">←</button><select id="choose" aria-label="Choose constellation"></select><button id="next" aria-label="Next constellation">→</button></div><button id="guide" aria-pressed="false">Trace guide</button></footer></main><script src="charts.js?v=14"></script><script src="atlas-language.js"></script><script>
const $=s=>document.querySelector(s),svg=$('svg'),ns='http://www.w3.org/2000/svg';let index=0,guiding=false,found=charts.map(()=>new Set());try{const saved=JSON.parse(localStorage.getItem('constellation-builder-v1'));found=charts.map((c,i)=>new Set((Array.isArray(saved?.[i])?saved[i]:[]).filter(n=>Number.isInteger(n)&&n>=0&&n<c.p.length)))}catch{}
function el(tag,attrs,parent=svg){const node=document.createElementNS(ns,tag);for(const [k,v] of Object.entries(attrs))node.setAttribute(k,v);parent.append(node);return node}
function selectStar(n){if(found[index].has(n))return;found[index].add(n);try{localStorage.setItem('constellation-builder-v1',JSON.stringify(found.map(s=>[...s])))}catch{}draw(n)}
function draw(focus){const c=charts[index],hits=found[index],done=hits.size===c.p.length;svg.replaceChildren();$('#choose').value=index;$('.field').dataset.north=tr('N','北');$('#plate').textContent=tr('Celestial atlas　/　Plate ','星座圖鑑　／　圖版 ')+String(index+1).padStart(2,'0');$('#nameplate').textContent=tr(c.name,plateNames[index][0]);$('#subtitle').textContent=tr(c.sub,plateNames[index][1]);$('#hint').textContent=done?(myths[c.name]?.[Number(chinese)] || tr('The figure is revealed. Choose another chart to continue.','星座圖像已浮現。選擇另一張星圖，繼續探索。')):tr('Touch the bright stars inside the chart to uncover its figure.','點亮星圖中的亮星，讓隱藏的星座圖像浮現。');$('#progress').textContent=hits.size+' / '+c.p.length+tr(' stars traced',' 顆星已點亮');$('#total').textContent=found.filter((s,i)=>s.size===charts[i].p.length).length+' / '+charts.length+tr(' revealed',' 幅已顯現');$('.field').classList.toggle('done',done);const art=$('.art');art.style.backgroundImage=index<10?'url(engravings.webp)':'url(myths.webp)';art.style.backgroundSize=index<10?'500% 200%':'200% 200%';art.style.backgroundPosition=index<10?(index%5)*25+'% '+(index<5?0:100)+'%':((index-10)%2)*100+'% '+(index<12?0:100)+'%';for(let angle=0;angle<360;angle+=5){const a=angle*Math.PI/180;let r=angle%30?49:48;el('line',{x1:50+r*Math.cos(a),y1:50+r*Math.sin(a),x2:50+50*Math.cos(a),y2:50+50*Math.sin(a),stroke:'#b5a37b','stroke-width':.18})}
for(const l of c.lines)for(let j=1;j<l.length;j++){const a=l[j-1],b=l[j],lit=hits.has(a)&&hits.has(b);if(lit||guiding)el('line',{x1:c.p[a][0],y1:c.p[a][1],x2:c.p[b][0],y2:c.p[b][1],stroke:lit?'#e8ce8a':'#8291a1','stroke-width':lit?.35:.17,'stroke-dasharray':lit?'none':'1 1'})}
for(const [n,[x,y]] of c.p.entries()){const lit=hits.has(n),group=el('g',{class:'star',tabindex:lit?-1:0,role:'button','aria-label':tr('Star ','星星 ')+(n+1)+(lit?tr(', traced','，已點亮'):''),'aria-pressed':lit});el('circle',{cx:x,cy:y,r:2.15,fill:lit?'#b9985528':'#cee3ff13'},group);el('circle',{class:'core',cx:x,cy:y,r:lit?.78:.58,fill:lit?'#f5d68a':'#f0f5ff'},group);group.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();selectStar(n)}}}
if(focus!==undefined&&document.body.matches(':focus-within')===false&&keyboard){(svg.querySelector('[tabindex="0"]')||$('#next')).focus()}}
let keyboard=false;document.addEventListener('keydown',()=>keyboard=true,true);document.addEventListener('pointerdown',()=>keyboard=false,true);
svg.onclick=e=>{const rect=svg.getBoundingClientRect(),x=(e.clientX-rect.left)*100/rect.width,y=(e.clientY-rect.top)*100/rect.height;const list=charts[index].p.map(([a,b],n)=>[Math.hypot(x-a,y-b),n]).filter(([d,n])=>d<Math.max(2.2,1400/rect.width)&&!found[index].has(n)).sort((a,b)=>a[0]-b[0]);if(list.length)selectStar(list[0][1])};
$('#language').onclick=()=>{chinese=!chinese;try{localStorage.setItem('constellation-language',chinese?'zh-TW':'en')}catch{}localizeControls();draw()};localizeControls();function move(n){index=(n+charts.length)%charts.length;draw()}$('#choose').onchange=e=>move(+e.target.value);$('#prev').onclick=()=>move(index-1);$('#next').onclick=()=>move(index+1);$('#guide').onclick=()=>{guiding=!guiding;updateGuide();draw()};
function sky(){const cv=$('canvas'),w=innerWidth,h=innerHeight;cv.width=w;cv.height=h;const g=cv.getContext('2d');let seed=2301;function r(){seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296}for(let i=0;i<w*h/530;i++){let x=r()*w,y=r()*h,v=r();g.fillStyle='rgba(211,222,235,'+(.12+v*.53)+')';g.beginPath();g.arc(x,y,.25+v*.85,0,7);g.fill()}}onresize=sky;sky();draw()
</script></html>
